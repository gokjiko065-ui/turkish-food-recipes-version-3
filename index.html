<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sofra — Nine dishes from the Turkish table</title>
  <meta name="description" content="Sofra is a bilingual (English / Türkçe) cookbook of nine Turkish dishes with recipes, sources and stories.">
  <meta name="theme-color" content="#3E1F3D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <style>
/* =========================================================
   Sofra — styles
   Palette: pomegranate, saffron, olive, aubergine, cream, ink
   ========================================================= */
:root {
  --pomegranate: #7A1B2A;
  --saffron: #E0A526;
  --saffron-deep: #8A5A00;
  --olive: #4A5726;
  --aubergine: #3E1F3D;
  --cream: #F7EFE0;
  --cream-2: #EFE3CC;
  --ink: #1E1A17;
  --ink-soft: #4A4139;
  --line: rgba(30, 26, 23, .16);
  --accent: var(--pomegranate);   /* overridden per recipe */
  --on-accent: #FBF5E8;

  --font-display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;

  --radius: 14px;
  --gutter: clamp(16px, 4vw, 40px);
  --max: 1180px;
  --header-h: 64px;
  --ease: cubic-bezier(.2, .7, .2, 1);

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + var(--safe-t) + 12px); }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.65;
  color: var(--ink);
  background: var(--cream);
  /* paper texture, pure CSS */
  background-image:
    radial-gradient(rgba(122, 27, 42, .035) 1px, transparent 1.2px),
    radial-gradient(rgba(62, 31, 61, .03) 1px, transparent 1.2px);
  background-size: 22px 22px, 31px 31px;
  background-position: 0 0, 11px 13px;
  padding-left: var(--safe-l);
  padding-right: var(--safe-r);
  overflow-x: hidden;
}
img, svg { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; font-weight: 800; letter-spacing: -.01em; }
p { margin: 0 0 1em; }
a { color: inherit; }
button { font: inherit; color: inherit; }
ul, ol { margin: 0; padding: 0; list-style: none; }

.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -80px; z-index: 100; background: var(--ink); color: var(--cream); padding: 12px 18px; border-radius: 10px; transition: top .2s; }
.skip:focus { top: calc(12px + var(--safe-t)); }

:focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; border-radius: 6px; }
.on-dark :focus-visible, .hero :focus-visible, .rhero :focus-visible { outline-color: #FFD166; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(247, 239, 224, .92);
  -webkit-backdrop-filter: saturate(1.2) blur(10px);
  backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: var(--safe-t);
}
.header-inner {
  max-width: var(--max); margin: 0 auto; min-height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 6px var(--gutter);
}
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--pomegranate); min-height: 44px; }
.brand-mark { width: 34px; height: 34px; transition: transform .8s var(--ease); }
.brand:hover .brand-mark, .brand:focus-visible .brand-mark { transform: rotate(60deg); }
.brand-word { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--ink); letter-spacing: -.02em; }
.main-nav { margin-left: auto; display: flex; gap: 4px; }
.main-nav a {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px;
  text-decoration: none; font-weight: 600; font-size: .95rem; color: var(--ink-soft);
  transition: background .2s, color .2s;
}
.main-nav a:hover { background: rgba(122, 27, 42, .08); color: var(--pomegranate); }
.main-nav a[aria-current="page"] { background: var(--pomegranate); color: var(--on-accent); }

.lang-switch {
  display: inline-flex; padding: 3px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--cream);
  flex: none;
}
.lang-switch button {
  min-height: 40px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent;
  font-weight: 700; font-size: .9rem; cursor: pointer; transition: background .2s, color .2s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.lang-switch button:hover { background: rgba(30, 26, 23, .08); }
.lang-switch button:active { transform: scale(.95); }
.lang-switch button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }

@media (max-width: 560px) {
  .header-inner { gap: 6px; padding-left: 12px; padding-right: 12px; }
  .brand-word { font-size: 1.25rem; }
  .main-nav a { padding: 0 9px; font-size: .88rem; }
  .brand-mark { width: 28px; height: 28px; }
  .lang-switch button { padding: 0 9px; font-size: .82rem; min-width: 42px; }
}
@media (max-width: 400px) {
  .brand-word { display: none; }
}

/* ---------- layout helpers ---------- */
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
.eyebrow { font-weight: 700; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; }
.ornament { display: block; width: 120px; height: 14px; color: currentColor; opacity: .7; }

/* ---------- hero ---------- */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--aubergine); color: #FBF5E8;
  padding: clamp(48px, 9vw, 110px) 0 clamp(64px, 10vw, 130px);
}
.hero::before { /* geometric tile pattern */
  content: ""; position: absolute; inset: 0; z-index: -2; opacity: .5;
  background:
    radial-gradient(circle at 25% 20%, rgba(224, 165, 38, .22), transparent 40%),
    radial-gradient(circle at 80% 75%, rgba(122, 27, 42, .6), transparent 45%);
}
.hero-tiles { position: absolute; inset: 0; z-index: -1; opacity: .22; color: var(--saffron); }
.hero-inner { display: grid; gap: 32px; grid-template-columns: 1.2fr .8fr; align-items: center; }
.hero .eyebrow { color: var(--saffron); }
.hero h1 { font-size: clamp(2.8rem, 9vw, 6.4rem); margin: .25em 0 .3em; font-weight: 800; }
.hero h1 .word { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; }
.hero h1 .word > span { display: inline-block; }
.hero h1 em { font-style: italic; font-weight: 500; color: var(--saffron); }
.hero p.lead { font-size: clamp(1.05rem, 2.4vw, 1.3rem); max-width: 36ch; color: #F0E4CE; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 26px;
  border-radius: 999px; border: 0; background: var(--saffron); color: var(--ink); font-weight: 700; font-size: 1rem;
  text-decoration: none; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.28);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: #F0B83C; transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,.28); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
.btn .arrow { transition: transform .25s var(--ease); }
.btn:hover .arrow { transform: translateY(3px); }

.hero-plate { position: relative; aspect-ratio: 1; width: min(100%, 440px); justify-self: center; }
.hero-plate svg { width: 100%; height: 100%; }
.hero-plate .spin { transform-origin: 50% 50%; }
.seeds { position: absolute; inset: 0; pointer-events: none; }
.seeds i {
  position: absolute; width: 10px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: #B3243A; box-shadow: inset -2px -2px 0 rgba(0,0,0,.2);
  left: calc(var(--x) * 1%); top: -10%; opacity: 0;
}
@media (max-width: 800px) {
  .hero-inner { grid-template-columns: 1fr; }
  .hero-plate { width: min(78%, 320px); order: -1; }
  .hero p.lead { max-width: none; }
}

.marquee { overflow: hidden; background: var(--saffron); color: var(--ink); border-block: 2px solid var(--ink); }
.marquee-track { display: flex; width: max-content; }
.marquee-track span { font-family: var(--font-display); font-weight: 800; font-size: clamp(1rem, 3vw, 1.4rem); padding: 10px 0; white-space: nowrap; }

/* ---------- recipes section ---------- */
.section { padding: clamp(44px, 7vw, 90px) 0; }
.section-head { display: grid; gap: 10px; margin-bottom: 28px; }
.section-head h2 { font-size: clamp(2rem, 5.5vw, 3.4rem); color: var(--aubergine); }
.section-head p { color: var(--ink-soft); max-width: 52ch; margin: 0; }

.tools { display: grid; gap: 14px; margin-bottom: 26px; }
.search { position: relative; max-width: 520px; }
.search input {
  width: 100%; min-height: 52px; padding: 0 48px 0 46px; border-radius: 999px; border: 2px solid var(--ink);
  background: #FFFBF2; font: inherit; font-size: 1rem; color: var(--ink);
  transition: box-shadow .2s, border-color .2s;
}
.search input::placeholder { color: #6B5F54; }
.search input:focus { outline: none; border-color: var(--pomegranate); box-shadow: 0 0 0 4px rgba(122, 27, 42, .18); }
.search .icon { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--ink-soft); pointer-events: none; }
.search .clear {
  position: absolute; right: 6px; top: 50%; translate: 0 -50%; min-width: 40px; min-height: 40px; border: 0; background: transparent;
  border-radius: 50%; cursor: pointer; font-size: 1.1rem; color: var(--ink-soft);
}
.search .clear:hover { background: rgba(30, 26, 23, .08); }
.search .clear[hidden] { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent;
  font-weight: 600; font-size: .95rem; cursor: pointer; transition: background .2s, color .2s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.chip:hover { background: rgba(122, 27, 42, .09); }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.count { font-size: .9rem; color: var(--ink-soft); font-weight: 600; }

.grid { display: grid; gap: clamp(18px, 3vw, 32px); grid-template-columns: repeat(12, 1fr); }
.card { grid-column: span 4; }
.card:nth-child(5n + 1) { grid-column: span 6; }
.card:nth-child(5n + 2) { grid-column: span 6; }
@media (max-width: 960px) { .card, .card:nth-child(5n+1), .card:nth-child(5n+2) { grid-column: span 6; } }
@media (max-width: 640px) { .card, .card:nth-child(5n+1), .card:nth-child(5n+2) { grid-column: 1 / -1; } }

.card a {
  display: grid; text-decoration: none; background: var(--card-c, var(--pomegranate)); color: #FBF5E8; border-radius: var(--radius);
  overflow: hidden; height: 100%; position: relative; box-shadow: 0 2px 0 rgba(0,0,0,.18), 0 18px 34px -20px rgba(30,26,23,.55);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.card a:hover { transform: translateY(-6px) rotate(-.4deg); box-shadow: 0 2px 0 rgba(0,0,0,.18), 0 28px 40px -20px rgba(30,26,23,.6); }
.card a:active { transform: translateY(-1px) scale(.99); }
.card .ph { aspect-ratio: 4 / 3; }
.card:nth-child(5n+1) .ph, .card:nth-child(5n+2) .ph { aspect-ratio: 16 / 10; }
.card-body { padding: 18px 20px 22px; display: grid; gap: 6px; border-top: 3px double rgba(251,245,232,.35); }
.card-num { font-family: var(--font-display); font-style: italic; opacity: .85; font-size: .95rem; }
.card h3 { font-size: clamp(1.4rem, 3vw, 1.9rem); }
.card .alt { font-size: .98rem; opacity: .92; margin: 0; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .92; margin-top: 4px; }
.card .go { position: absolute; right: 14px; bottom: 16px; width: 38px; height: 38px; border-radius: 50%; background: var(--saffron); color: var(--ink); display: grid; place-items: center; transition: transform .35s var(--ease); }
.card a:hover .go { transform: translateX(4px) rotate(-45deg); }

.empty { text-align: center; padding: 56px 20px; border: 2px dashed var(--line); border-radius: var(--radius); background: rgba(255,251,242,.6); }
.empty h3 { font-size: 1.6rem; color: var(--aubergine); margin-bottom: 8px; }
.empty p { color: var(--ink-soft); margin-bottom: 16px; }
.btn-ghost { background: var(--ink); color: var(--cream); box-shadow: none; }
.btn-ghost:hover { background: var(--pomegranate); box-shadow: none; }

.skeleton { background: linear-gradient(100deg, #E9DCC1 30%, #F6ECD7 50%, #E9DCC1 70%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: var(--radius); min-height: 280px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- image slot / placeholder / credit ---------- */
.ph, .photo { position: relative; overflow: hidden; background: var(--ph-c, var(--aubergine)); }
.ph svg, .photo img { width: 100%; height: 100%; object-fit: cover; }
.photo img { opacity: 0; transition: opacity .5s; }
.photo img.loaded { opacity: 1; }
.ph-badge {
  position: absolute; left: 12px; top: 12px; z-index: 2; padding: 4px 10px; border-radius: 999px;
  background: rgba(30, 26, 23, .7); color: #FBF5E8; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
}
.credit {
  position: absolute; left: 8px; bottom: 8px; z-index: 3; max-width: calc(100% - 16px);
  padding: 3px 9px; border-radius: 6px; font-size: .72rem; line-height: 1.35; text-decoration: none;
  color: rgba(226, 226, 226, .82); background: rgba(20, 20, 20, .42);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  transition: color .2s, background .2s;
}
a.credit:hover, .credit:focus, .credit:focus-visible, .credit:active, .credit.show { color: #fff; background: rgba(15, 15, 15, .9); }
.credit:focus-visible { outline: 2px solid #FFD166; outline-offset: 1px; }

/* ---------- recipe page ---------- */
.recipe { background: var(--cream); }
.rhero { position: relative; background: var(--accent); color: var(--on-accent); isolation: isolate; overflow: hidden; }
.rhero-inner { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(18px, 4vw, 48px); align-items: center; padding-top: clamp(24px, 5vw, 56px); padding-bottom: clamp(32px, 6vw, 72px); }
.rhero .crumbs { grid-column: 1 / -1; display: flex; }
.crumbs a {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px;
  background: rgba(0,0,0,.22); text-decoration: none; font-weight: 600; font-size: .92rem; transition: background .2s, transform .15s;
}
.crumbs a:hover { background: rgba(0,0,0,.36); transform: translateX(-3px); }
.rhero .eyebrow { opacity: .9; }
.rhero h1 { font-size: clamp(2.4rem, 7vw, 4.8rem); margin: .2em 0 .25em; }
.rhero .alt { font-family: var(--font-display); font-style: italic; font-size: clamp(1.05rem, 2.5vw, 1.35rem); opacity: .92; margin-bottom: 16px; }
.rhero .intro { font-size: clamp(1.05rem, 2.2vw, 1.2rem); max-width: 46ch; }
.rhero .photo-wrap { position: relative; }
.rhero .ph, .rhero .photo { aspect-ratio: 4 / 3.2; border-radius: 200px 200px var(--radius) var(--radius); box-shadow: 0 0 0 6px rgba(251,245,232,.22), 0 24px 40px -18px rgba(0,0,0,.55); }
.steam { position: absolute; left: 50%; top: -6%; translate: -50% 0; width: 40%; height: 28%; pointer-events: none; z-index: 4; }
.steam path { fill: none; stroke: rgba(251,245,232,.55); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 80; stroke-dashoffset: 80; }
@media (max-width: 800px) {
  .rhero-inner { grid-template-columns: 1fr; }
  .rhero .photo-wrap { order: -1; }
  .rhero .crumbs { order: -2; }
  .rhero .ph, .rhero .photo { border-radius: 120px 120px var(--radius) var(--radius); }
}

.facts { background: var(--cream-2); border-block: 1px solid var(--line); }
.facts-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; }
.fact { padding: 16px 12px; text-align: center; border-right: 1px solid var(--line); }
.fact:last-child { border-right: 0; }
.fact .k { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.fact .v { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--accent); }
.facts-note { font-size: .85rem; color: var(--ink-soft); padding: 0 var(--gutter) 12px; max-width: var(--max); margin: 0 auto; text-align: center; }

.rbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: clamp(24px, 5vw, 64px); padding-top: clamp(32px, 6vw, 72px); padding-bottom: clamp(32px, 6vw, 72px); }
@media (max-width: 860px) { .rbody { grid-template-columns: 1fr; } }
.panel h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); color: var(--accent); display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.panel h2 .mark { flex: none; width: 34px; height: 34px; color: var(--accent); }
.ing-group + .ing-group { margin-top: 22px; }
.ing-group h3 { font-family: var(--font-body); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; padding-bottom: 6px; border-bottom: 2px solid var(--accent); margin-bottom: 4px; }
.ing li { border-bottom: 1px dotted var(--line); }
.ing label { display: flex; gap: 12px; align-items: flex-start; padding: 11px 4px; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }
.ing input { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin-top: 1px; border: 2px solid var(--accent); border-radius: 7px; background: #FFFBF2; display: grid; place-content: center; cursor: pointer; transition: background .2s, transform .15s; }
.ing input::after { content: ""; width: 12px; height: 7px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; rotate: -45deg; translate: 0 -1px; scale: 0; transition: scale .2s var(--ease); }
.ing input:checked { background: var(--accent); }
.ing input:checked::after { scale: 1; }
.ing input:active { transform: scale(.9); }
.ing input:checked + span { text-decoration: line-through; text-decoration-color: var(--accent); opacity: .62; }
@media (min-width: 861px) { .ing-panel { position: sticky; top: calc(var(--header-h) + var(--safe-t) + 16px); align-self: start; } }

.steps { counter-reset: s; display: grid; gap: 14px; }
.step { position: relative; border: 1.5px solid var(--line); border-radius: var(--radius); background: #FFFBF2; padding: 16px 16px 16px 66px; transition: background .3s, border-color .3s; }
.step::before { counter-increment: s; content: counter(s); position: absolute; left: 14px; top: 14px; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; transition: transform .35s var(--ease); }
.step p { margin: 0 0 10px; }
.step button { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; font-weight: 700; font-size: .9rem; cursor: pointer; transition: background .2s, color .2s, transform .1s; }
.step button:hover { background: var(--accent); color: var(--on-accent); }
.step button:active { transform: scale(.95); }
.step.done { background: rgba(255,251,242,.5); border-color: var(--accent); }
.step.done p { opacity: .65; }
.step.done::before { transform: rotate(360deg) scale(1.05); }
.step.done button { background: var(--accent); color: var(--on-accent); }

.notes { background: var(--cream-2); border-left: 6px solid var(--accent); }
.block { margin-top: clamp(32px, 5vw, 56px); }
.block ul { display: grid; gap: 10px; padding-left: 1.1em; }
.block li { list-style: disc; padding-left: .2em; }
.block li::marker { color: var(--accent); }
.story { background: #FFFBF2; border: 1.5px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 3vw, 30px); }
.story p:last-child { margin-bottom: 0; }
.story .dropcap::first-letter { font-family: var(--font-display); font-weight: 800; float: left; font-size: 3.4em; line-height: .85; padding: .06em .1em 0 0; color: var(--accent); }
.flag { background: #FFF1C9; border: 1.5px solid #C9961A; border-radius: var(--radius); padding: 14px 16px; margin-top: 18px; font-size: .95rem; }
.flag strong { text-transform: uppercase; font-size: .72rem; letter-spacing: .14em; display: block; margin-bottom: 4px; color: #6B4A00; }

.pager a { display: grid; gap: 2px; padding: 16px 18px; border-radius: var(--radius); text-decoration: none; background: var(--pg-c); color: #FBF5E8; min-height: 72px; transition: transform .25s var(--ease); }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes wordUp { from { transform: translateY(110%) rotate(4deg); } to { transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes steam { 0% { stroke-dashoffset: 80; opacity: 0; } 30% { opacity: 1; } 100% { stroke-dashoffset: -80; opacity: 0; } }
@keyframes fall { 0% { opacity: 0; transform: translateY(-20px) rotate(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(520px) rotate(300deg); } }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.6) translateY(-30px); opacity: 0; } }

html.motion #main > * { animation: pageIn .5s var(--ease) both; }
html.motion [data-reveal] { opacity: 0; transform: translateY(26px); transition: opacity .7s var(--ease), transform .7s var(--ease); transition-delay: var(--d, 0ms); }
html.motion [data-reveal].in { opacity: 1; transform: none; }
html.motion [data-reveal="left"] { transform: translateX(-30px); }
html.motion [data-reveal="left"].in { transform: none; }

html.motion .hero h1 .word > span { animation: wordUp .9s var(--ease) both; animation-delay: calc(var(--i) * 90ms + 150ms); }
html.motion .hero .lead, html.motion .hero .btn, html.motion .hero .eyebrow { animation: rise .8s var(--ease) both; }
html.motion .hero .eyebrow { animation-delay: 50ms; }
html.motion .hero .lead { animation-delay: .6s; }
html.motion .hero .btn { animation-delay: .8s; }
html.motion .hero-plate .spin { animation: spin 60s linear infinite; }
html.motion .hero-plate .bob { animation: bob 6s ease-in-out infinite; }
html.motion .hero-tiles { animation: spin 240s linear infinite; transform-origin: 70% 40%; }
html.motion .seeds i { animation: fall 5s linear infinite; animation-delay: var(--t); }
html.motion .marquee-track { animation: marquee 32s linear infinite; }
html.motion .marquee:hover .marquee-track { animation-play-state: paused; }
html.motion .steam path { animation: steam 3.4s ease-in-out infinite; }
html.motion .steam path:nth-child(2) { animation-delay: .9s; }

.burst { position: fixed; z-index: 90; pointer-events: none; width: 12px; height: 16px; border-radius: 50%; background: #B3243A; animation: pop .8s ease-out forwards; }

/* touch: no hover-only tricks; keep hover effects subtle */
@media (hover: none) {
  .card a:hover { transform: none; }

}

/* reduced motion: calm, nothing hidden */
@media (prefers-reduced-motion: reduce) {

  [data-reveal] { opacity: 1 !important; transform: none !important; }

  .seeds { display: none; }
  .steam { display: none; }

}
@media print {
  .site-header, .site-footer, .marquee, .tools, .pager, .step button { display: none !important; }
  .rhero { background: none; color: #000; }
}

.photo { position: relative; overflow: hidden; background: var(--ph-c, #3E1F3D); aspect-ratio: 4 / 3; }

        ]}
      ],
      steps: [
        { en: "For the filling, soften the onions in oil, add the mince and cook until it loses its raw colour. Season, stir in the walnuts and cool completely.", tr: "İç harç için soğanı yağda yumuşatın, kıymayı ekleyip çiğ rengi gidene kadar kavurun. Baharatlayın, cevizi ekleyin ve tamamen soğutun." },
        { en: "Rub the bulgur with a little of the water until it swells, then knead in the semolina, paste, paprika, salt and the rest of the water into a smooth, pliable dough, 10 to 15 minutes.", tr: "Bulguru biraz suyla ovup şişirin; irmik, salça, toz biber, tuz ve kalan suyu ekleyip 10–15 dakika pürüzsüz, elastik bir hamur olana kadar yoğurun." },
        { en: "With wet hands, take an egg-sized piece of dough, hollow it with a finger and thin the wall evenly.", tr: "Islak ellerle yumurta büyüklüğünde bir parça alın, parmağınızla oyup duvarını eşit ve ince hâle getirin." },
        { en: "Fill with a spoonful of cooled filling, pinch the opening closed and shape into a torpedo. Smooth any cracks with a damp finger.", tr: "Soğuk harçtan bir kaşık koyun, ağzını kapatıp torpido şekli verin. Çatlakları ıslak parmakla düzeltin." },
        { en: "Chill the shaped pieces for about 20 to 30 minutes so they hold together.", tr: "Şekillenen köfteleri bütün kalmaları için 20–30 dakika buzdolabında dinlendirin." },
        { en: "Fry in hot oil for about 5 to 6 minutes until deep brown, or simmer in boiling water until they float. Drain and serve hot with lemon.", tr: "Kızgın yağda 5–6 dakika koyu kahverengi olana kadar kızartın veya kaynar suda yüzeye çıkana kadar haşlayın. Süzüp limonla sıcak servis edin." }
      ],
      variations: [
        { en: "Boiled and fried versions both exist. Malatya’s içli köfte is a boiled bulgur köfte and is protected as a geographical indication, as is Gaziantep’s.", tr: "Hem haşlama hem kızartma versiyonları vardır. Malatya içli köftesi haşlama bir bulgur köftesidir ve Gaziantep içli köftesi gibi coğrafi işaretle tescillidir." },
        { en: "Adana has a grilled, skewer-cooked version that is also registered as a geographical indication.", tr: "Adana’nın şişte pişen bir versiyonu da coğrafi işaretle tescillidir." },
        { en: "Fillings differ by household and city; some add pomegranate molasses or parsley.", tr: "İç harç eve ve şehre göre değişir; bazıları nar ekşisi veya maydanoz ekler." }
      ],
      story: {
        en: "İçli köfte is made across Türkiye’s southeast and in neighbouring Levantine cuisines, where it is called kibbeh. The Turkish Patent and Trademark Office has registered Gaziantep içli köftesi (27 May 2021) and Malatya içli köftesi as geographical indications. Gaziantep sources list it among the city’s köfte dishes.",
        tr: "İçli köfte Türkiye’nin güneydoğusunda ve komşu Levant mutfaklarında (kibbeh adıyla) yapılır. Türk Patent ve Marka Kurumu, Gaziantep içli köftesini (27 Mayıs 2021) ve Malatya içli köftesini coğrafi işaret olarak tescil etmiştir. Gaziantep kaynakları onu şehrin köfteleri arasında sayar."
      },
      imageNeeded: {
        en: "Real photo of içli köfte (fried torpedo shells, ideally cut open to show the filling).",
        tr: "İçli köftenin gerçek fotoğrafı (kızarmış torpido şeklinde, tercihen içi görünecek biçimde kesilmiş)."
      },
      sources: [
        { title: "KÜRE — Gaziantep İçli Köftesi (TÜRKPATENT registration)", url: "https://kureansiklopedi.com/tr/detay/gaziantep-icli-koftesi-4697a" },
        { title: "KÜRE — Malatya İçli Köftesi", url: "https://kureansiklopedi.com/detay/malatya-icli-koftesi-f7ed7" },
        { title: "Gaziantep Governorship, Provincial Directorate of Culture and Tourism — Gaziantep Mutfağı (PDF)", url: "https://engelsiz.ktb.gov.tr/Eklenti/60849,gaziantepmutfagi2018pdf.pdf" },
        { title: "Lezzet — Turkish Stuffed Meatball (İçli Köfte)", url: "https://www.lezzet.com.tr/en/recipe/turkish-stuffed-meatball" },
        { title: "Yemek.com — Antep Usulü İçli Köfte", url: "https://yemek.com/tarif/antep-usulu-icli-kofte" }
      ]
    },

    /* 4 ─────────────────────────────────────────── Yüksük çorbası */
    {
      slug: "yuksuk-corbasi",
      course: "soup",
      color: "#7C5A0A",
      steam: true,
      name: { tr: "Yüksük çorbası", en: "Thimble soup" },
      alt_name: { tr: "Mantı çorbası", en: "Yüksük çorbası, tiny-dumpling soup" },
      intro: {
        en: "A warming soup of tiny thimble-sized dumplings and chickpeas in a tomato-pepper broth with mint, popular through the winter in southern Türkiye.",
        tr: "Güney Türkiye’de kış boyunca sevilen; yüksük boyutunda minik mantılar ve nohutun nane ve salçalı bir suda buluştuğu sıcak bir çorba."
      },
      meta: { prep: 15, cook: 25, serves: 6 },
      ingredients: [
        { title: { en: "Soup", tr: "Çorba" }, items: [
          { en: "2 cups tiny mantı (small dumplings), fresh or frozen", tr: "2 su bardağı minik mantı (taze veya dondurulmuş)" },
          { en: "1 cup cooked chickpeas", tr: "1 su bardağı haşlanmış nohut" },
          { en: "6 cups hot water or light stock", tr: "6 su bardağı sıcak su veya hafif et suyu" },
          { en: "1 tbsp butter and 2 tbsp oil", tr: "1 yemek kaşığı tereyağı ve 2 yemek kaşığı sıvı yağ" },
          { en: "1 tbsp tomato paste, 1 tsp pepper paste (optional)", tr: "1 yemek kaşığı domates salçası, 1 çay kaşığı biber salçası (isteğe bağlı)" },
          { en: "Salt to taste", tr: "Tuz" }
        ]},
        { title: { en: "Seasoning", tr: "Baharat" }, items: [
          { en: "1 tsp dried mint", tr: "1 çay kaşığı kuru nane" },
          { en: "1 tsp chilli flakes, ½ tsp black pepper", tr: "1 çay kaşığı pul biber, ½ çay kaşığı karabiber" },
          { en: "Garlic and pomegranate molasses, if you like", tr: "Dilerseniz sarımsak ve nar ekşisi" }
        ]}
      ],
      steps: [
        { en: "Melt the butter with the oil in a wide pot, then fry the tomato (and pepper) paste briefly until fragrant.", tr: "Geniş bir tencerede tereyağını yağla eritin; salçaları kokusu çıkana kadar kısaca kavurun." },
        { en: "Add the mint, chilli flakes and pepper, stir for a few seconds and pour in the hot water.", tr: "Nane, pul biber ve karabiberi ekleyip birkaç saniye karıştırın, sıcak suyu ilave edin." },
        { en: "Bring to a boil, add the chickpeas and salt and simmer for a few minutes.", tr: "Kaynayınca nohutları ve tuzu ekleyip birkaç dakika pişirin." },
        { en: "Lower the heat, add the mantı and cook gently so they stay whole, until tender, about 10 to 15 minutes.", tr: "Ateşi kısıp mantıları ekleyin; dağılmamaları için kısık ateşte yumuşayana kadar, yaklaşık 10–15 dakika pişirin." },
        { en: "Taste, adjust salt and serve hot, with extra mint or a squeeze of pomegranate molasses.", tr: "Tadına bakıp tuzunu ayarlayın; sıcak, isterseniz ekstra nane veya nar ekşisiyle servis edin." }
      ],
      variations: [
        { en: "Two different traditions exist. The Ministry of Culture and Tourism lists “Thimble Soup (Yüksük Çorbası)” with chickpeas and flour, while the popular Adana and Mersin version uses tiny mantı with chickpeas, as written here.", tr: "İki farklı anlatı var. Kültür ve Turizm Bakanlığı “Yüksük Çorbası”nı nohut ve unla listeler; Adana ve Mersin’de yaygın olan versiyon ise burada yazıldığı gibi minik mantı ve nohutla yapılır." },
        { en: "Chicken and potato versions appear in modern Turkish recipe sites.", tr: "Modern Türk tarif sitelerinde tavuklu ve patatesli versiyonlar da görülür." }
      ],
      story: {
        en: "The name refers to the thimble (yüksük), a tool described as having been used to cut the small rounds of dough for the mantı. Sources place it especially in Adana and Mersin, and say it is also made in Hatay, Osmaniye, Gaziantep and Central Anatolia. It is eaten mainly in the cold months.",
        tr: "Adı, mantı hamurundan küçük daireler kesmek için kullanıldığı aktarılan yüksükten gelir. Kaynaklar onu özellikle Adana ve Mersin’e bağlar; Hatay, Osmaniye, Gaziantep ve İç Anadolu’da da yapıldığını belirtir. Ağırlıklı olarak soğuk aylarda yenir."
      },
      nameNote: {
        en: "“Yuksek soup” in the brief is read as Yüksük çorbası. The Ministry of Culture and Tourism lists it as “Thimble Soup (Yüksük Çorbası)”, which supports this reading. Please still confirm it is the intended dish.",
        tr: "Brifteki “yuksek soup” Yüksük çorbası olarak okundu. Kültür ve Turizm Bakanlığı bunu “Thimble Soup (Yüksük Çorbası)” olarak listeliyor; bu okumayı destekliyor. Yine de amaçlanan yemek olduğunu lütfen teyit edin."
      },
      imageNeeded: {
        en: "Real photo of yüksük çorbası (tiny dumplings and chickpeas in red broth).",
        tr: "Yüksük çorbasının gerçek fotoğrafı (kırmızı suda minik mantılar ve nohut)."
      },
      sources: [
        { title: "Ministry of Culture and Tourism — Thimble Soup (Yüksük Çorbası)", url: "https://www.ktb.gov.tr/EN-99041/thimble-soup.html" },
        { title: "KÜRE — Yüksük Çorbası (Yemek)", url: "https://kureansiklopedi.com/tr/detay/yuksuk-corbasi-yemek-55d0d" },
        { title: "Yemek.com — Yüksük Çorbası Tarifi", url: "https://yemek.com/tarif/yuksuk-corbasi/" }
      ]
    },

    /* 5 ─────────────────────────────────────────── Aşure */
    {
      slug: "asure",
      course: "dessert",
      color: "#7A1B2A",
      steam: false,
      name: { tr: "Aşure", en: "Noah’s pudding" },
      alt_name: { tr: "Aşure", en: "Aşure (ashure)" },
      intro: {
        en: "A sweet porridge of wheat, pulses, dried fruit and nuts, cooked in large pots and shared with neighbours.",
        tr: "Buğday, bakliyat, kuru meyve ve kuruyemişten yapılan, büyük kazanlarda pişirilip komşularla paylaşılan tatlı bir çorba."
      },
      meta: { prep: 30, cook: 90, serves: 12, soak: { en: "Soak the pulses and wheat overnight (about 8 hours, estimate)", tr: "Bakliyat ve buğdayı bir gece (yaklaşık 8 saat, tahmini) ıslatın" } },
      ingredients: [
        { title: { en: "Base", tr: "Ana malzeme" }, items: [
          { en: "1 cup dehusked wheat (dövme, about 180 g)", tr: "1 su bardağı aşurelik buğday (dövme, yaklaşık 180 g)" },
          { en: "⅓ cup chickpeas (about 60 g)", tr: "⅓ su bardağı nohut (yaklaşık 60 g)" },
          { en: "⅓ cup dried white beans (about 60 g)", tr: "⅓ su bardağı kuru fasulye (yaklaşık 60 g)" },
          { en: "¼ cup rice", tr: "¼ su bardağı pirinç" },
          { en: "About 2 litres water", tr: "Yaklaşık 2 litre su" },
          { en: "1½ to 2 cups sugar, to taste", tr: "1,5–2 su bardağı şeker (damak tadına göre)" }
        ]},
        { title: { en: "Fruit and flavour", tr: "Meyve ve aroma" }, items: [
          { en: "A handful each of dried apricots, dried figs and raisins", tr: "Birer avuç kuru kayısı, kuru incir ve kuru üzüm" },
          { en: "Strips of orange peel (optional)", tr: "Portakal kabuğu şeritleri (isteğe bağlı)" }
        ]},
        { title: { en: "To top", tr: "Üzeri için" }, items: [
          { en: "Walnuts, hazelnuts, pomegranate seeds, cinnamon", tr: "Ceviz, fındık, nar taneleri, tarçın" }
        ]}
      ],
      steps: [
        { en: "Rinse the wheat, chickpeas and beans and soak them overnight in plenty of water.", tr: "Buğday, nohut ve fasulyeyi yıkayıp bol suda bir gece ıslatın." },
        { en: "Drain and boil the chickpeas and beans until tender; boil the wheat separately or together if pots are limited, until the grains split slightly.", tr: "Süzüp nohut ve fasulyeyi yumuşayana kadar haşlayın; buğdayı ayrı veya kap yetmezse birlikte, taneler hafifçe çatlayana kadar pişirin." },
        { en: "Combine everything in a large pot with the 2 litres of water and the rice, and cook gently, stirring often so it doesn’t stick.", tr: "Hepsini büyük bir tencerede 2 litre su ve pirinçle birleştirip sık sık karıştırarak, yapışmasın diye kısık ateşte pişirin." },
        { en: "When the rice and wheat are soft, stir in the chopped dried fruit and sugar. Simmer 15 to 20 more minutes.", tr: "Pirinç ve buğday yumuşayınca doğranmış kuru meyveleri ve şekeri ekleyip 15–20 dakika daha pişirin." },
        { en: "It will look thin at first; it thickens as it cools. Ladle into bowls and let it set.", tr: "Başta sulu görünür; soğudukça kıvam alır. Kaselere paylaştırıp dinlendirin." },
        { en: "Top with walnuts, hazelnuts, pomegranate seeds and cinnamon before serving.", tr: "Servis etmeden önce ceviz, fındık, nar taneleri ve tarçınla süsleyin." }
      ],
      variations: [
        { en: "There is no single recipe. Households and regions vary the grains, fruit and spices; commonly cited rules say at least seven, ten or fifteen ingredients, and Alevi tradition is described as using twelve.", tr: "Tek bir tarif yoktur. Evler ve yöreler tahıl, meyve ve baharatı değiştirir; yedi, on veya on beş malzeme gibi kurallar anılır, Alevi geleneğinde ise on iki malzeme kullanıldığı aktarılır." },
        { en: "Some cooks add rose water, orange peel, pomegranate molasses or beet juice for colour.", tr: "Bazı ustalar gül suyu, portakal kabuğu, nar ekşisi veya renk için pancar suyu ekler." }
      ],
      story: {
        en: "According to a widely told tradition, aşure comes from the last supplies cooked together by Noah’s family after the flood; we present this as tradition rather than established history. The Ministry of Culture and Tourism describes the month after the Feast of Sacrifice as the Aşure month, and aşure is commonly made around the 10th of Muharram and shared with neighbours.",
        tr: "Yaygın bir anlatıya göre aşure, tufandan sonra Nuh’un ailesinin kalan erzakı birlikte pişirmesinden doğmuştur; bunu kesinleşmiş bir tarih olarak değil, bir gelenek olarak aktarıyoruz. Kültür ve Turizm Bakanlığı, Kurban Bayramı’ndan sonraki ayı Aşure ayı olarak anar; aşure genellikle Muharrem’in onuncu günü civarında pişirilip komşulara dağıtılır."
      },
      imageNeeded: {
        en: "Real photo of aşure in bowls with walnut, pomegranate and cinnamon.",
        tr: "Kaselerde ceviz, nar ve tarçınla servis edilmiş aşurenin gerçek fotoğrafı."
      },
      sources: [
        { title: "Ministry of Culture and Tourism — Aşure (Sample Dishes from Turkish Cuisine)", url: "https://www.ktb.gov.tr/EN-98860/asure.html" },
        { title: "Wikipedia — Ashure (cites Fieldhouse, Laudan, Isin)", url: "https://en.wikipedia.org/wiki/Ashure" },
        { title: "Yemek.com — Aşure Tarifi", url: "https://yemek.com/tarif/asure/" }
      ]
    },

    /* 6 ─────────────────────────────────────────── Kabak tatlısı */
    {
      slug: "kabak-tatlisi",
      course: "dessert",
      color: "#9A4B0F",
      steam: false,
      name: { tr: "Kabak tatlısı", en: "Turkish pumpkin dessert" },
      alt_name: { tr: "Bal kabağı tatlısı", en: "Kabak tatlısı, candied pumpkin" },
      intro: {
        en: "Thick wedges of pumpkin left in sugar until they make their own syrup, baked until glossy and soft, then finished with tahini and walnuts.",
        tr: "Kalın bal kabağı dilimlerinin şekerle bekleyip kendi şuruplarını salması, parlak ve yumuşak olana dek pişirilmesi; tahin ve cevizle servis edilmesi."
      },
      meta: { prep: 20, cook: 75, serves: 6, soak: { en: "Rest sugared pumpkin 2 hours or overnight (estimate)", tr: "Şekerlenmiş kabağı 2 saat veya bir gece bekletin (tahmini)" } },
      ingredients: [
        { title: { en: "Pumpkin", tr: "Kabak" }, items: [
          { en: "1 kg firm pumpkin (peeled, seeds removed)", tr: "1 kg sert bal kabağı (soyulmuş, çekirdeği çıkarılmış)" },
          { en: "1 cup sugar (about 200 g)", tr: "1 su bardağı toz şeker (yaklaşık 200 g)" },
          { en: "A few cloves or a cinnamon stick (optional)", tr: "Birkaç karanfil veya bir çubuk tarçın (isteğe bağlı)" },
          { en: "½ cup water", tr: "½ su bardağı su" }
        ]},
        { title: { en: "To serve", tr: "Servis için" }, items: [
          { en: "Tahini", tr: "Tahin" },
          { en: "Crushed walnuts", tr: "Dövülmüş ceviz" },
          { en: "Kaymak or thick yoghurt (optional)", tr: "Kaymak veya süzme yoğurt (isteğe bağlı)" }
        ]}
      ],
      steps: [
        { en: "Cut the pumpkin into thick slices or wedges, about 3 to 4 cm wide.", tr: "Kabağı yaklaşık 3–4 cm kalınlığında dilimleyin veya dörde bölün." },
        { en: "Layer the pieces in a baking dish, coating each layer generously with sugar. Leave for 2 hours or overnight so the sugar draws out juice.", tr: "Parçaları fırın kabına dizin, her katı bol şekerle kaplayın. Şeker su salsın diye 2 saat veya bir gece bekletin." },
        { en: "Add the water and the cloves or cinnamon, cover with baking paper and foil.", tr: "Suyu ve karanfil veya tarçını ekleyip yağlı kağıt ve folyoyla kapatın." },
        { en: "Bake at about 180 °C for 45 minutes, then uncover and bake another 20 to 30 minutes, until the pumpkin is tender and the syrup has thickened.", tr: "Yaklaşık 180 °C fırında 45 dakika pişirin; sonra açıp kabak yumuşayıp şurup koyulaşana dek 20–30 dakika daha pişirin." },
        { en: "Cool, then serve at room temperature or chilled with a drizzle of tahini and walnuts.", tr: "Soğutun; oda sıcaklığında veya soğuk, üzerine tahin ve ceviz gezdirerek servis edin." }
      ],
      variations: [
        { en: "Regional versions differ: Hatay’s lime-water kabak tatlısı is crisp, Sakarya’s kabak kıvırma is a baklava-like folk dessert, and Rumeli kitchens make a milk-based kara kabak sweet. Aydın’s kabak tatlısı has a geographical-indication registration.", tr: "Yöresel versiyonlar farklıdır: Hatay’ın kireçte kabak tatlısı çıtırdır, Sakarya’nın kabak kıvırması baklavayı andıran bir halk tatlısıdır, Rumeli mutfağı sütlü kara kabak tatlısı yapar. Aydın kabak tatlısı coğrafi işaretlidir." },
        { en: "Serve with tahini, kaymak or only walnuts; people argue which is best.", tr: "Tahin, kaymak ya da yalnızca cevizle servis edilir; hangisinin en iyi olduğu tartışılır." }
      ],
      story: {
        en: "Kabak tatlısı is a staple of winter in Turkish kitchens. We do not state a single origin: the dessert takes different forms in different regions, and some of the older-origin claims in circulation could not be backed by a source we could verify.",
        tr: "Kabak tatlısı Türk mutfaklarında kışın başlıca tatlılardandır. Tek bir köken belirtmiyoruz: tatlı farklı yörelerde farklı biçimler alıyor ve dolaşımdaki bazı eski köken iddialarını doğrulayabildiğimiz bir kaynakla destekleyemedik."
      },
      imageNeeded: {
        en: "Real photo of kabak tatlısı with tahini and walnut.",
        tr: "Tahin ve cevizli kabak tatlısının gerçek fotoğrafı."
      },
      sources: [
        { title: "KÜRE — Kabak Tatlısı", url: "https://kureansiklopedi.com/tr/detay/kabak-tatlisi-751303" },
        { title: "Habertürk — Sakarya’nın kabak kıvırması", url: "https://www.haberturk.com/sakarya-nin-400-yillik-lezzeti-kabak-kivirma-3863183" },
        { title: "Yemek.com — Hatay usulü kireçte kabak tatlısı", url: "https://yemek.com/tarif/citir-kabak-tatlisi/" },
        { title: "NTV — Aydın’ın coğrafi işaret tescilli kabak tatlısı", url: "https://www.ntv.com.tr/n-life/n-lezzetler/aydinin-cografi-isaret-tescilli-kabak-tatlisi,dU-RVikKX0-NocM5HR6y2w" },
        { title: "Give Recipe — Kabak Tatlısı (oven method)", url: "https://www.giverecipe.com/?p=410" }
      ]
    },

    /* 7 ─────────────────────────────────────────── Çılbır */
    {
      slug: "cilbir",
      course: "breakfast",
      color: "#6F5A00",
      steam: true,
      name: { tr: "Çılbır", en: "Poached eggs with garlic yoghurt" },
      alt_name: { tr: "Çılbır", en: "Çılbır (Turkish eggs)" },
      intro: {
        en: "Softly poached eggs over cool garlicky yoghurt, finished with sizzling chilli butter.",
        tr: "Soğuk sarımsaklı yoğurdun üzerine yumuşak poşe yumurtalar; üstüne cızırdayan pul biberli tereyağı."
      },
      meta: { prep: 10, cook: 10, serves: 2 },
      ingredients: [
        { title: { en: "Eggs and yoghurt", tr: "Yumurta ve yoğurt" }, items: [
          { en: "4 very fresh eggs", tr: "4 çok taze yumurta" },
          { en: "1½ cups strained (thick) yoghurt, at room temperature", tr: "1,5 su bardağı süzme yoğurt, oda sıcaklığında" },
          { en: "1 to 2 cloves garlic, crushed with salt", tr: "1–2 diş sarımsak, tuzla ezilmiş" },
          { en: "1 tbsp vinegar and 1 tsp salt for the poaching water", tr: "Haşlama suyu için 1 yemek kaşığı sirke ve 1 çay kaşığı tuz" }
        ]},
        { title: { en: "Chilli butter", tr: "Pul biberli tereyağı" }, items: [
          { en: "2 tbsp butter", tr: "2 yemek kaşığı tereyağı" },
          { en: "1 tsp chilli flakes (pul biber)", tr: "1 çay kaşığı pul biber" },
          { en: "Dried mint or fresh dill (optional)", tr: "Kuru nane veya taze dereotu (isteğe bağlı)" }
        ]},
        { title: { en: "To serve", tr: "Servis için" }, items: [

        ]}
      ],
      steps: [
        { en: "Stir the yoghurt with the garlic and a pinch of salt, and spread it in two shallow bowls.", tr: "Yoğurdu sarımsak ve bir tutam tuzla karıştırıp iki geniş kaseye yayın." },
        { en: "Bring a wide pan of water to a gentle simmer with the vinegar and salt.", tr: "Geniş bir tavada suyu sirke ve tuzla hafif kaynamaya getirin." },
        { en: "Crack each egg into a cup, slide it into the water and poach for about 3 minutes, until the whites are set and the yolks are runny.", tr: "Her yumurtayı önce bir kâseye kırıp suya kaydırın ve beyazı tutup sarısı akışkan kalana kadar yaklaşık 3 dakika poşe edin." },
        { en: "Lift the eggs out with a slotted spoon, drain and lay them on the yoghurt.", tr: "Yumurtaları delikli kaşıkla alıp süzün ve yoğurdun üzerine yerleştirin." },
        { en: "Melt the butter until foaming, stir in the chilli flakes for a few seconds and spoon it over the eggs. Serve at once with bread.", tr: "Tereyağını köpürene kadar eritin, pul biberi birkaç saniye çevirip yumurtaların üzerine gezdirin. Hemen ekmekle servis edin." }

      variations: [
        { en: "Many versions use garlic in the yoghurt; some cooks leave it out (the related “yoğurtlu yumurta”).", tr: "Birçok versiyonda yoğurda sarımsak katılır; bazı ustalar katmaz (yoğurtlu yumurta)." },
        { en: "Butter sauces with walnuts, tomato paste or dried peppers are also made. In Bosnia, Montenegro and Serbia, čimbur refers to a fried-egg dish.", tr: "Cevizli, salçalı veya kuru biberli tereyağı soslar da yapılır. Bosna, Karadağ ve Sırbistan’da čimbur kızarmış yumurta yemeğini ifade eder." }
      ],
      story: {
        en: "Çılbır is widely described as having Ottoman-era roots, and appears under the same name in neighbouring cuisines. Specific dates in circulation (such as 15th-century sultans) rest on weak sourcing, so we don’t repeat them.",

      },
      imageNeeded: {

        tr: "Çılbırın gerçek fotoğrafı: sarımsaklı yoğurt üzerinde poşe yumurta ve kırmızı pul biberli tereyağı."

      ],
      steps: [

        { en: "Cover and cook until the meat has released its juices and then reabsorbed most of them, about 20 to 30 minutes.", tr: "Kapağını kapatıp et suyunu salıp büyük kısmını çekene kadar, yaklaşık 20–30 dakika pişirin." },

      story: {

      variations: [

      story: {

    var count = document.getElementById("count");
    count.textContent = (typeof UI.resultsCount[state.lang] === "function" ? UI.resultsCount[state.lang](list.length) : list.length);
    var clear = document.getElementById("clear");
    if (clear) clear.hidden = !state.q;
    if (!list.length) {
      box.innerHTML = '<div class="empty"><h3>' + esc(T("emptyTitle")) + '</h3><p>' + esc(T("emptyBody")) + '</p><button class="btn btn-ghost" id="reset" type="button">' + esc(T("clear")) + '</button></div>';
      var rb = document.getElementById("reset");
      rb.addEventListener("click", function () { state.q = ""; state.course = "all"; renderHome(true); });
      return;
    }
    box.innerHTML = '<ul class="grid">' + list.map(cardHTML).join("") + '</ul>';
    observe(box);
  }

  function recipeHTML(r) {
    var idx = R.indexOf(r), prev = R[(idx + R.length - 1) % R.length], next = R[(idx + 1) % R.length], m = r.meta;
    var facts = '<div class="fact"><span class="k">' + esc(T("prep")) + '</span><span class="v">' + dur(m.prep) + '</span></div>' +
      '<div class="fact"><span class="k">' + esc(T("cook")) + '</span><span class="v">' + dur(m.cook) + '</span></div>' +
      '<div class="fact"><span class="k">' + esc(T("serves")) + '</span><span class="v">' + m.serves + '</span></div>' +
      (m.yieldNote ? '<div class="fact"><span class="k">' + esc(T("makes")) + '</span><span class="v">' + esc(L(m.yieldNote)) + '</span></div>' : "");
    var ing = r.ingredients.map(function (g, gi) {
      return '<div class="ing-group"><h3>' + esc(L(g.title)) + '</h3><ul class="ing">' + g.items.map(function (it, ii) {
        var id = "i-" + r.slug + "-" + gi + "-" + ii;
        return '<li><label for="' + id + '"><input id="' + id + '" type="checkbox"><span>' + esc(L(it)) + '</span></label></li>';
      }).join("") + '</ul></div>';
    }).join("");
    var steps = r.steps.map(function (s, i) {
      return '<li class="step" data-reveal><p>' + esc(L(s)) + '</p><button type="button" aria-pressed="false" data-step="' + i + '">' + esc(T("markDone")) + '</button></li>';
    }).join("");
    var flags = "";
    if (r.nameNote) flags = '<div class="flag"><strong>' + esc(T("reviewNote")) + '</strong>' + esc(L(r.nameNote)) + '</div>';
    return '' +
      '<article class="recipe" style="--accent:' + r.color + '" lang="' + state.lang + '">' +
      '<header class="rhero on-dark"><div class="wrap rhero-inner">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="' + href("") + '#recipes" id="back"><span aria-hidden="true">←</span> ' + esc(T("back")) + '</a></nav>' +
      '<div><p class="eyebrow">№ ' + (idx + 1) + ' · ' + esc(L(UI.courses[r.course])) + '</p><h1>' + esc(L(r.name)) + '</h1>' +
      '<p class="alt"' + (state.lang === "en" ? ' lang="tr"' : "") + '>' + esc(state.lang === "en" ? r.name.tr : r.name.en) + '</p>' +
      '<p class="intro">' + esc(L(r.intro)) + '</p></div>' +
      '<div class="photo-wrap">' + (r.steam ? STEAM : "") + imageSlot(r, { eager: true, sizes: "(max-width: 800px) 100vw, 45vw" }) + '</div>' +
      '</div></header>' +
      '<section class="facts" aria-label="' + esc(T("serves")) + '"><div class="facts-inner wrap">' + facts + '</div><p class="facts-note">' + esc(T("estimateNote")) + (m.soak ? " " + esc(L(m.soak)) + "." : "") + '</p></section>' +
      '<div class="wrap rbody">' +
      '<section class="panel ing-panel" aria-labelledby="h-ing" data-reveal="left"><h2 id="h-ing">' + MARK + esc(T("ingredients")) + '</h2>' + ing + '</section>' +
      '<section class="panel" aria-labelledby="h-met"><h2 id="h-met">' + MARK + esc(T("method")) + '</h2><ol class="steps">' + steps + '</ol></section>' +
      '</div>' +
      '<div class="wrap">' +
      '<section class="block" aria-labelledby="h-var" data-reveal><div class="panel"><h2 id="h-var">' + MARK + esc(T("variations")) + '</h2></div><ul>' + r.variations.map(function (v) { return '<li>' + esc(L(v)) + '</li>'; }).join("") + '</ul></section>' +
      '<section class="block" aria-labelledby="h-story" data-reveal><div class="panel"><h2 id="h-story">' + MARK + esc(T("story")) + '</h2></div><div class="story"><p class="dropcap">' + esc(L(r.story)) + '</p>' + flags + '</div></section>' +
      '<section class="block" aria-labelledby="h-src" data-reveal><div class="panel"><h2 id="h-src">' + MARK + esc(T("sources")) + '</h2></div><p class="sources-note">' + esc(T("sourcesNote")) + '</p><ol class="sources">' +
      r.sources.map(function (s) { return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title) + '</a></li>'; }).join("") + '</ol></section>' +
      '<nav class="pager block" aria-label="' + esc(T("navRecipes")) + '">' +
      '<a style="--pg-c:' + prev.color + '" href="' + href("recipe/" + prev.slug) + '"><span class="k">← ' + esc(T("prev")) + '</span><span class="t">' + esc(L(prev.name)) + '</span></a>' +
      '<a style="--pg-c:' + next.color + '" href="' + href("recipe/" + next.slug) + '"><span class="k">' + esc(T("next")) + ' →</span><span class="t">' + esc(L(next.name)) + '</span></a></nav>' +
      '</div></article>';
  }

  function termsHTML() {
    var t = D.terms;
    return '<article class="terms" lang="' + state.lang + '"><p class="eyebrow" style="color:var(--pomegranate)">' + esc(T("termsLink")) + '</p><h1>' + esc(L(t.title)) + '</h1>' +
      '<p class="updated">' + esc(L(t.updated)) + '</p><p class="note">' + esc(L(t.draftNote)) + '</p>' + ORN +
      t.sections.map(function (s) { return '<section data-reveal><h2>' + esc(L(s.h)) + '</h2>' + s.p.map(function (p) { return '<p>' + esc(L(p)) + '</p>'; }).join("") + '</section>'; }).join("") + '</article>';
  }

  function notFoundHTML() {
    return '<section class="section"><div class="wrap empty"><h3>' + esc(T("notFoundTitle")) + '</h3><p>' + esc(T("notFoundBody")) + '</p><a class="btn btn-ghost" href="' + href("") + '">' + esc(T("back")) + '</a></div></section>';
  }

  function footerHTML() {
    return '<div class="wrap footer-inner"><a class="brand" href="' + href("") + '"><span class="brand-word">Sofra</span></a><p>' + esc(T("footerNote")) + '</p><a href="' + href("terms") + '">' + esc(T("termsLink")) + '</a></div>';
  }

  /* ---------- chrome (header/footer text for current language) ---------- */
  function updateChrome(page) {
    root.lang = state.lang;
    document.getElementById("skip").textContent = T("skip");
    document.getElementById("main-nav").setAttribute("aria-label", T("nav"));
    var nr = document.getElementById("nav-recipes"), nt = document.getElementById("nav-terms");
    nr.textContent = T("navRecipes"); nt.textContent = T("navTerms");
    nr.href = href(""); nt.href = href("terms");
    if (page !== "terms") nr.setAttribute("aria-current", "page"); else nr.removeAttribute("aria-current");
    if (page === "terms") nt.setAttribute("aria-current", "page"); else nt.removeAttribute("aria-current");
    document.getElementById("brand").href = href("");
    document.getElementById("lang-switch").setAttribute("aria-label", T("langLabel"));
    ["en", "tr"].forEach(function (l) { document.getElementById("lang-" + l).setAttribute("aria-pressed", String(state.lang === l)); });
    document.getElementById("site-footer").innerHTML = footerHTML();
  }

  /* ---------- reveal ---------- */
  function checkImages(scope) {
    (scope || document).querySelectorAll(".photo img").forEach(function (img) {
      if (img.complete) {
        if (img.naturalWidth) img.classList.add("loaded"); else img.closest(".photo").classList.add("failed");
      }
    });
  }
  function observe(scope) {
    checkImages(scope);
    var els = (scope || document).querySelectorAll("[data-reveal]:not(.in)");
    if (!motionOK() || !("IntersectionObserver" in window)) { els.forEach(function (e) { e.classList.add("in"); }); return; }
    if (!io) io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    els.forEach(function (e) { io.observe(e); });
  }

  /* ---------- seed burst on completed step ---------- */
  function burst(btn) {
    if (!motionOK()) return;
    var rect = btn.getBoundingClientRect();
    for (var i = 0; i < 8; i++) {
      var s = document.createElement("i");
      s.className = "burst";
      s.style.left = (rect.left + rect.width / 2 + (Math.random() - .5) * 70) + "px";
      s.style.top = (rect.top + rect.height / 2 + (Math.random() - .5) * 20) + "px";
      s.style.animationDelay = (i * 30) + "ms";
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 1000); })(s);
    }
  }

  /* ---------- render + route ---------- */
  function setTitle(t) { document.title = t ? t + " — Sofra" : "Sofra — " + T("tagline"); }

  function renderHome(keepScroll) {
    main.innerHTML = homeHTML();
    updateChrome("home");
    setTitle("");
    var q = document.getElementById("q");
    q.addEventListener("input", function () { state.q = q.value; renderResults(); });
    document.getElementById("clear").addEventListener("click", function () { state.q = ""; q.value = ""; renderResults(); q.focus(); });
    main.querySelectorAll(".chip").forEach(function (b) {
      b.addEventListener("click", function () {
        state.course = b.getAttribute("data-course");
        main.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        renderResults();
      });
    });
    document.getElementById("cta").addEventListener("click", function () {
      document.getElementById("recipes").scrollIntoView({ behavior: motionOK() ? "smooth" : "auto" });
    });
    var box = document.getElementById("results");
    box.setAttribute("aria-busy", "true");
    box.innerHTML = '<div class="grid"><div class="card skeleton" style="grid-column:span 6" aria-hidden="true"></div><div class="card skeleton" style="grid-column:span 6" aria-hidden="true"></div></div><p class="sr-only">' + esc(T("loading")) + '</p>';
    requestAnimationFrame(function () { renderResults(); box.setAttribute("aria-busy", "false"); observe(main); });
    observe(main);
  }

  function renderRecipe(r) {
    main.innerHTML = recipeHTML(r);
    updateChrome("recipe");
    setTitle(L(r.name));
    main.querySelectorAll(".step button").forEach(function (b) {
      b.addEventListener("click", function () {
        var li = b.closest(".step");
        var done = li.classList.toggle("done");
        b.setAttribute("aria-pressed", String(done));
        b.textContent = done ? T("stepDone") + " ✓" : T("markDone");
        if (done) burst(b);
      });
    });
    observe(main);
  }

  function renderTerms() {
    main.innerHTML = termsHTML();
    updateChrome("terms");
    setTitle(L(D.terms.title));
    observe(main);
  }

  function parse() {
    var parts = (location.hash || "").replace(/^#\/?/, "").split("#")[0].split("/").filter(Boolean);
    var lang = parts[0];
    if (lang !== "en" && lang !== "tr") { return { redirect: "#/" + state.lang + "/" + parts.join("/") }; }
    return { lang: lang, page: parts[1] || "home", slug: parts[2] };
  }

  var firstRender = true;
  function route() {
    var p = parse();
    if (p.redirect) { location.replace(p.redirect.replace(/\/$/, "/")); return; }
    var langChanged = p.lang !== state.lang;
    state.lang = p.lang;
    try { localStorage.setItem("sofra-lang", state.lang); } catch (e) {}
    var draw = function () {
      if (p.page === "home") renderHome();
      else if (p.page === "recipe" && bySlug(p.slug)) renderRecipe(bySlug(p.slug));
      else if (p.page === "terms") renderTerms();
      else { main.innerHTML = notFoundHTML(); updateChrome("home"); setTitle(""); }
    };
    // hash with the section anchor (e.g. "#/en/#recipes")
    var wantRecipes = /#recipes$/.test(location.hash) || (location.hash.split("#").length > 2);
    var scrollTop = langChanged && !firstRender ? window.scrollY : 0;
    if (document.startViewTransition && motionOK() && !firstRender && !langChanged) document.startViewTransition(draw); else draw();
    if (langChanged && !firstRender) {
      window.scrollTo(0, scrollTop);
      announce(T("switchedTo"));
    } else if (wantRecipes && p.page === "home") {
      var el = document.getElementById("recipes");
      if (el) el.scrollIntoView();
    } else if (!firstRender) {
      window.scrollTo(0, 0);
      main.focus({ preventScroll: true });
    }
    firstRender = false;
  }

  /* language switcher keeps the same route */
  document.getElementById("lang-switch").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b) return;
    var next = b.getAttribute("data-lang");
    if (next === state.lang) return;
    var p = parse();
    var rest = [p.page === "home" ? "" : p.page, p.slug].filter(Boolean).join("/");
    location.hash = "#/" + next + "/" + rest;
  });

  window.addEventListener("hashchange", route);
  if (!location.hash || location.hash === "#") { state.lang = pickLang(); location.replace("#/" + state.lang + "/"); }
  else {
    var first = (location.hash.replace(/^#\/?/, "").split("/")[0]);
    state.lang = (first === "en" || first === "tr") ? first : pickLang();
  }
  route();
})();

</script>
</body>
</html>
